<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مختبر الأنيونات</title>
<meta name="description" content="Interactive test-tube lab for anion reactions, Groups I–VI (PHC 101, L01–L03)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one phone-width column (max 560px); bench picker → light-box stage → result card;
   the chrome is ink on porcelain with no hue at all, so the only colors on screen are reaction colors. */
:root {
  --paper: #F1F2EF;
  --surface: #FFFFFF;
  --ink: #1B1D1C;
  --graphite: #595E5B;
  --rule: #D1D3CE;
  --wash: #E5E6E2;
  /* The light box is a physical object: same in both themes so a color word always looks the same. */
  --box: #DAD9D3;
  --box-ink: #3A3C3A;
  --font-display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-sci: "Source Serif 4", Cambria, "Times New Roman", serif;
  --fs-xs: 12px; --fs-s: 13.5px; --fs-m: 15.5px; --fs-l: 18px; --fs-xl: 22px; --fs-xxl: 28px;
  --gutter: 16px;
  --nav-h: 62px;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101211; --surface: #181B19; --ink: #E8E9E5; --graphite: #A0A5A1; --rule: #2E322F; --wash: #222623;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101211; --surface: #181B19; --ink: #E8E9E5; --graphite: #A0A5A1; --rule: #2E322F; --wash: #222623;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--fs-m); line-height: 1.6; -webkit-text-size-adjust: 100%; }
#app { max-width: 560px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }

/* scientific text: formulas and the doctor's English wording */
.f { font-family: var(--font-sci); unicode-bidi: isolate; direction: ltr; white-space: nowrap; }
.en { font-family: var(--font-sci); direction: ltr; unicode-bidi: isolate; text-align: left; }
.en .f { white-space: normal; }
sub, sup { font-size: .7em; line-height: 0; position: relative; vertical-align: baseline; }
sub { bottom: -.28em; } sup { top: -.5em; }

/* top bar */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 6px 14px; border-bottom: 2px solid var(--ink); margin-bottom: 16px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xxl); line-height: 1.15; margin: 0; letter-spacing: 0; }
.top .sub { color: var(--graphite); font-size: var(--fs-xs); text-align: left; }

.vhead { margin-bottom: 14px; }
.vhead h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xl); margin: 0 0 2px; text-wrap: balance; }
.vhead p { margin: 0; color: var(--graphite); font-size: var(--fs-s); }

/* chips and segmented controls */
.lt { font-family: var(--font-sci); direction: ltr; unicode-bidi: isolate; overflow-wrap: break-word; }
details.tests-cat { border-top: 1px solid var(--rule); padding-top: 4px; }
details.tests-cat summary { min-height: 44px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: var(--fs-s); font-weight: 600; color: var(--graphite); }
details.tests-cat summary small { font-weight: 400; }
details.tests-cat .chips { padding-bottom: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; min-width: 44px; padding: 6px 12px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.25; }
.chip:hover { border-color: var(--graphite); }
.chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip small { font-size: var(--fs-xs); opacity: .8; font-family: var(--font-body); }
.grp-tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.grp-tabs.filter7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.grp-tabs .chip { padding: 4px 0; font-family: var(--font-sci); font-weight: 600; font-size: var(--fs-m); }
.label { display: block; font-size: var(--fs-xs); color: var(--graphite); margin: 14px 0 6px; font-weight: 600; }

.select-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px; align-items: stretch; }
.select-row button { border: 1.5px solid var(--rule); background: var(--surface); border-radius: 10px; font-size: 20px; line-height: 1; }
select.big { width: 100%; min-height: 48px; padding: 8px 10px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--surface); font-family: var(--font-sci); font-size: var(--fs-m); direction: ltr; }

/* the light box stage */
.stage { margin-top: 16px; background: var(--box); border-radius: 18px; padding: 10px 10px 12px; color: var(--box-ink); position: relative; }
.stage-cap { font-family: var(--font-sci); font-size: var(--fs-m); text-align: center; direction: ltr; min-height: 1.6em; padding-inline: 44px; }
.stage-cap .plus { opacity: .6; padding-inline: 4px; }
.stage-cap .cond { display: block; font-size: var(--fs-xs); opacity: .8; }
.tube { width: 100%; max-width: 200px; margin: 0 auto; }
.tube.wide { max-width: 330px; }
.tube svg { width: 100%; height: auto; display: block; overflow: visible; }
.replay { position: absolute; top: 8px; left: 8px; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--box-ink); background: transparent; color: var(--box-ink); display: grid; place-items: center; }
.replay svg { width: 20px; height: 20px; }
.strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 4px; direction: ltr; margin-top: 4px; font-family: var(--font-sci); font-size: var(--fs-s); }
.strip .cw { display: inline-flex; align-items: center; gap: 5px; }
.strip .arr { opacity: .55; }
.sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,.35); display: inline-block; flex: none; }
.sw.colorless { background: repeating-linear-gradient(45deg, #ECEBE7 0 3px, #FFFFFF 3px 6px) !important; }

/* result card */
.result { margin-top: 14px; background: var(--surface); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.result .obs { font-size: var(--fs-l); line-height: 1.45; margin: 0; }
.fld { display: grid; gap: 2px; min-width: 0; }
.fld > span:first-child { font-size: var(--fs-xs); color: var(--graphite); font-weight: 600; }
.fld .en, .fld .val { min-width: 0; overflow-wrap: anywhere; }
.ref { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-sci); font-weight: 600; font-size: var(--fs-s); border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 10px; direction: ltr; unicode-bidi: isolate; width: max-content; }
.res-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.res-head .kind { font-size: var(--fs-xs); color: var(--graphite); }
.extra { display: inline-block; border: 1.5px dashed var(--graphite); border-radius: 6px; padding: 0 6px; font-size: var(--fs-xs); color: var(--graphite); font-weight: 600; }
.note { font-size: var(--fs-s); color: var(--graphite); }

/* ⚠️ slide vs correct */
.flag { border: 2px solid var(--ink); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; }
.flag .fh { font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.flag .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.flag .pair > div { min-width: 0; border-radius: 8px; padding: 8px; background: var(--wash); }
.flag .pair b { display: block; font-size: var(--fs-xs); color: var(--graphite); margin-bottom: 2px; }
.flag .pair .en { font-size: var(--fs-s); overflow-wrap: anywhere; }
.flag .right { background: transparent !important; border: 1.5px solid var(--ink); }

/* ★ + ليه؟ + compare */
.star { width: 44px; height: 44px; border: 0; background: transparent; display: inline-grid; place-items: center; color: var(--ink); padding: 0; flex: none; }
.star svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.star[aria-pressed="true"] svg { fill: currentColor; }
.res-head .row { gap: 4px; flex-wrap: nowrap; }
details.why { border: 1.5px dashed var(--rule); border-radius: 10px; padding: 0 10px; }
details.why summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
details.why p { margin: 0 0 8px; line-height: 1.75; }
.why-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-bottom: 10px; }
.src { display: inline-block; border: 1.5px solid var(--graphite); border-radius: 6px; padding: 0 6px; font-size: var(--fs-xs); color: var(--graphite); font-weight: 600; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.seg button { min-height: 46px; border: 0; background: var(--surface); font-weight: 700; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.cmp-sets .chip { font-family: var(--font-sci); font-size: var(--fs-s); }
.cmp-row { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; align-items: end; margin-top: 4px; }
.cmp-cell { min-width: 0; display: grid; gap: 2px; justify-items: center; }
.cmp-tube, .cmp-tube.wide { max-width: 100%; }
.cmp-f { font-family: var(--font-sci); font-size: var(--fs-s); font-weight: 600; direction: ltr; }
.tip { margin-top: 12px; border: 2px solid var(--ink); border-radius: var(--r); padding: 10px 12px; background: var(--surface); }
.tip .fh { font-weight: 700; }
.tip p { margin: 4px 0 8px; line-height: 1.75; }
.cmp-notes { display: grid; gap: 8px; margin-top: 10px; }
.cmp-note { background: var(--surface); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.cmp-note .strip { justify-content: flex-start; }
.cmp-note .chip { justify-self: start; }

/* find */
input.big.search { width: 100%; min-height: 48px; padding: 8px 12px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-family: var(--font-sci); }
.cchip { gap: 6px; padding-inline: 10px; font-size: var(--fs-s); }
.fgroup { margin-top: 12px; }
.fgh { font-family: var(--font-display); font-size: var(--fs-l); margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.fgh small { font-family: var(--font-sci); color: var(--graphite); font-size: var(--fs-s); font-weight: 400; }
.fres { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; background: var(--surface); border: 1.5px solid var(--rule); border-radius: 10px; padding: 6px 6px 6px 8px; margin-bottom: 6px; }
.fres-main { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; text-align: start; border: 0; background: transparent; padding: 0; min-height: 48px; min-width: 0; }
.fres-main svg { width: 44px; height: 44px; }
.fres-t { display: grid; gap: 2px; min-width: 0; }
.fres-rg { font-size: var(--fs-xs); color: var(--graphite); }
.fres-o { font-size: var(--fs-s); line-height: 1.35; }
.fres-side { display: grid; justify-items: center; gap: 0; }

/* grid view */
.mbadge { position: absolute; top: -3px; inset-inline-start: -3px; width: 19px; height: 19px; }
.mbadge svg { width: 19px; height: 19px; display: block; }
.mlegend .mbadge { position: static; display: inline-block; vertical-align: middle; }
.mb-ink { fill: var(--ink); } .mb-paper { fill: var(--surface); } .mb-stroke { stroke: var(--ink); } .mb-pstroke { stroke: var(--surface); }
.mlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 0 12px; font-size: var(--fs-s); }
.mlegend .note { flex-basis: 100%; }
.gtable .practice { margin: 0 4px 8px; }
.match { display: grid; gap: 10px; }
.mcol { display: grid; gap: 6px; align-content: start; min-width: 0; }
.mcol:first-child { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.mcol .opt { min-width: 0; width: 100%; }
.opt > span { min-width: 0; overflow-wrap: anywhere; }
.mleft[aria-pressed="true"] { border: 2.5px solid var(--ink); }
.mright { font-size: var(--fs-s); }
.tf-row { grid-template-columns: 1fr 1fr; }
.opt.tf { justify-content: center; font-weight: 700; }
.fill-opts .opt .sw { margin-top: 3px; }
.gtable { margin-top: 12px; background: var(--surface); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 10px 8px 6px; }
.gtable h3 { font-family: var(--font-display); font-size: var(--fs-l); margin: 0 4px 8px; font-weight: 700; }
.gtable h3 small { font-family: var(--font-sci); font-weight: 400; font-size: var(--fs-s); color: var(--graphite); }
.grow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--n), 48px); gap: 4px; align-items: center; padding-block: 3px; border-top: 1px solid var(--rule); }
.grow.ghead { border-top: 0; }
.grow .rl { font-family: var(--font-sci); font-size: var(--fs-xs); direction: ltr; text-align: left; line-height: 1.3; overflow-wrap: anywhere; min-width: 0; padding-inline-end: 4px; }
.grow .ah { font-family: var(--font-sci); font-size: var(--fs-s); text-align: center; font-weight: 600; line-height: 1.15; min-width: 0; }
.grow .ah .f { font-size: 11.5px; }
.gcat { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--graphite); font-weight: 600; padding: 6px 2px 0; }
.cell { position: relative; width: 48px; height: 48px; border: 0; padding: 0; background: transparent; border-radius: 8px; display: grid; place-items: center; }
.cell svg { width: 44px; height: 44px; display: block; }
.cell.empty { color: var(--rule); font-size: 18px; cursor: default; }

/* unknown + quiz */
.panel { background: var(--surface); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 14px; margin-top: 12px; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-s); color: var(--graphite); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }
.big-title { font-family: var(--font-display); font-size: var(--fs-xl); margin: 0 0 6px; }
.log { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.log li { border: 1.5px solid var(--rule); border-radius: 10px; padding: 8px 10px; display: grid; gap: 4px; }
.log .lr { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; }
.log .lr svg { width: 44px; height: 44px; }
.tests-cat { margin-top: 10px; }
.tests-cat .label { margin-top: 6px; }
.tests-cat .chip { font-family: var(--font-sci); font-size: var(--fs-s); min-height: 44px; }
.btn { min-height: 48px; padding: 8px 18px; border-radius: 10px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.q-stem { font-size: var(--fs-l); line-height: 1.45; margin: 6px 0 12px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; direction: ltr; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--surface); font-family: var(--font-sci); font-size: var(--fs-m); line-height: 1.35; display: flex; gap: 10px; align-items: flex-start; }
.opt .k { font-weight: 700; min-width: 1.2em; }
.opt[data-state="right"] { border: 2.5px solid var(--ink); font-weight: 600; }
.opt[data-state="right"]::after { content: "✓"; margin-left: auto; font-weight: 700; }
.opt[data-state="wrong"] { border-style: dashed; border-color: var(--graphite); text-decoration: line-through; color: var(--graphite); }
.opt[data-state="wrong"]::after { content: "✗"; margin-left: auto; text-decoration: none; }
.opt:disabled { cursor: default; }
.fb { margin-top: 12px; border-top: 2px solid var(--ink); padding-top: 10px; display: grid; gap: 6px; }
.fb .verdict { font-weight: 700; font-size: var(--fs-l); }
.weak { margin: 8px 0 0; padding-inline-start: 18px; display: grid; gap: 6px; }

/* play */
.controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.controls button { min-height: 52px; border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); display: grid; place-items: center; }
.controls button.main { background: var(--ink); color: var(--paper); }
.controls svg { width: 22px; height: 22px; }
.progress { height: 4px; background: var(--rule); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink); width: 0; }
.caption { margin-top: 12px; }

/* errors */
.err { background: var(--surface); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; margin-top: 10px; }
.err .row { justify-content: space-between; }
h3.sec { font-family: var(--font-display); font-size: var(--fs-l); margin: 22px 0 4px; }

/* bottom nav */
nav.tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
nav.tabs button { min-height: var(--nav-h); border: 0; background: transparent; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11px; white-space: nowrap; color: var(--graphite); padding: 6px 0 4px; position: relative; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; }
nav.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; inset-inline: 22%; height: 4px; background: var(--ink); border-radius: 0 0 3px 3px; }

/* SVG scene parts */
.scene { direction: ltr; }
.scene .glass { fill: none; stroke: #3A3C3A; stroke-width: 2.2; }
.scene .lip { fill: #F4F4F1; stroke: #3A3C3A; stroke-width: 2; }
.scene .liq { transition: fill var(--t, 900ms) ease, opacity var(--t, 900ms) ease; }
.scene .heap, .scene .turbid, .scene .layerfill, .scene .ringband, .scene .flamefill, .scene .stainfill, .scene .fumes ellipse {
  transition: fill var(--t, 900ms) ease, opacity var(--t, 900ms) ease, transform var(--t, 900ms) cubic-bezier(.2,.7,.2,1);
}
.scene .heap { transform-box: fill-box; transform-origin: 50% 100%; }
.scene .stainfill { transform-box: fill-box; transform-origin: 50% 50%; }
.scene .part { transition: transform var(--tf, 1000ms) cubic-bezier(.45,.05,.8,.6), opacity 400ms ease; }
.scene .bub { opacity: 0; }
.scene.bubbling .bub { animation: rise var(--tb, 1400ms) ease-in infinite; animation-delay: var(--d, 0ms); }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 90% { opacity: .9; } 100% { transform: translateY(-88px); opacity: 0; } }
.scene .bub.static { opacity: .9; animation: none; }
.scene .fumes { opacity: 0; transition: opacity var(--t, 900ms) ease; }
.scene.fuming .fumes ellipse { animation: drift var(--tm, 2600ms) ease-out 3; }
@keyframes drift { 0% { transform: translateY(14px) scale(.8); } 100% { transform: translateY(-6px) scale(1.06); } }
.scene .fumes ellipse { transform-box: fill-box; transform-origin: 50% 100%; }
.scene .heat path { fill: none; stroke: #3A3C3A; stroke-width: 2; stroke-linecap: round; }
.scene.heating .heat path { animation: shimmer 900ms ease-in-out infinite alternate; }
@keyframes shimmer { from { transform: translateY(0); opacity: .45; } to { transform: translateY(-3px); opacity: 1; } }
.scene .tubewrap { transform-box: view-box; transform-origin: 120px 280px; }
.scene.shaking .tubewrap { animation: shake 260ms ease-in-out 3; }
@keyframes shake { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.scene .odor path { fill: none; stroke: #3A3C3A; stroke-width: 1.6; stroke-dasharray: 3 4; opacity: 0; transition: opacity 600ms ease; }
.scene .lbl { font-family: var(--font-sci); font-size: 11px; fill: #3A3C3A; }
.scene .dropper { transition: transform 350ms ease, opacity 300ms ease; }
.scene .drop { transition: transform 350ms ease-in, opacity 200ms ease; }
.scene .genfumes, .scene .genppt { transition: opacity var(--t, 900ms) ease; }
.scene .pipe { transition: stroke-opacity var(--t, 900ms) ease; }
.scene .gen-lbl { font-size: 12px; }

<script>
(() => {
"use strict";

// ───────────────────────── data ─────────────────────────
const DATA = JSON.parse(document.getElementById("anion-data").textContent);
const ROWS = DATA.rows, COLORS = DATA.colors, ANIONS = DATA.anions, GROUPS = DATA.groups;
const ROW = new Map(ROWS.map(r => [r.id, r]));
const GROUP_IDS = ["I", "II", "III", "IV", "V", "VI"];
const CAT_ORDER = ["general", "dry", "confirm", "wet", "special"];
const CAT = {
  general: ["General properties", "خواص عامة (reducing)"],
  dry: ["Dry reactions", "تفاعلات جافة على الـ powder"],
  confirm: ["Confirmatory tests", "تأكيد الغاز اللي طلع"],
  wet: ["Wet reactions", "تفاعلات الـ salt solution"],
  special: ["Special tests", "اختبارات خاصة"]
};
const anionInfo = new Map(ANIONS.map(a => [a.anion, a]));
const anionsOf = g => ANIONS.filter(a => a.group === g).map(a => a.anion);

// anion → reagent → rows (reagents ordered by category, then by order on the slides)
const BY = new Map();
for (const a of ANIONS) BY.set(a.anion, new Map());
const firstSeen = new Map();
ROWS.forEach((r, i) => { if (!firstSeen.has(r.reagent)) firstSeen.set(r.reagent, i); });
const catOfReagent = new Map();
for (const r of ROWS) {
  const m = BY.get(r.anion);
  if (!m.has(r.reagent)) m.set(r.reagent, []);
  m.get(r.reagent).push(r);

function miniIcon(v, x0, w, k, idx) {
  const cx = x0 + w / 2, tw = w >= 40 ? 15 : 10, L = cx - tw / 2, Rr = cx + tw / 2, top = 5, sEnd = 30, bot = sEnd + tw / 2;
  const tube = `M${L} ${top} V${sEnd} A${tw / 2} ${tw / 2} 0 0 0 ${Rr} ${sEnd} V${top}`;
  const clip = `<clipPath id="q${k}_${idx}"><path d="${tube} Z"/></clipPath>`;
  const p = plan(v), C = w2 => hex(w2) || "none";
  const liqTop = v.type === "fumes" ? 16 : 13;
  if (v.type === "flame") return `<path d="M${cx} 36 C${cx - 9} 30 ${cx - 8} 16 ${cx} 5 C${cx + 8} 16 ${cx + 9} 30 ${cx} 36 Z" fill="${C(v.color)}" stroke="${BOXINK}" stroke-width=".8"/>`;
  if (v.type === "stain") {
    const surf = v.surface === "paper" ? `<rect x="${cx - 8}" y="4" width="16" height="32" fill="#FBFBF9" stroke="#8F908B"/>` : v.surface === "rod" ? `<rect x="${x0 + 3}" y="17" width="${w - 6}" height="5" rx="2.5" fill="rgba(255,255,255,.6)" stroke="${BOXINK}" stroke-width=".8"/>` : `<circle cx="${cx}" cy="20" r="${Math.min(15, w / 2 - 2)}" fill="#C4C5C0" stroke="#6E6F6B"/>`;
    return surf + `<circle cx="${v.surface === "rod" ? x0 + w - 6 : cx}" cy="20" r="5.5" fill="${v.color ? C(v.color) : "rgba(255,255,255,.8)"}" stroke="${BOXINK}" stroke-width=".6"/>`;
  }
  const lastSol = p.sol[p.sol.length - 1];
  let inner = `<rect x="${x0}" y="${liqTop}" width="${w}" height="40" fill="${C(lastSol)}" opacity="${lastSol === "colorless" ? .55 : .92}"/>`;
  if (p.layer) {
    const lw = p.layer.tl[p.layer.tl.length - 1];
    inner += p.layer.position === "top" ? `<rect x="${x0}" y="${liqTop}" width="${w}" height="6" fill="${C(lw)}" opacity="${lw === "colorless" ? .5 : .95}"/>` : `<rect x="${x0}" y="27" width="${w}" height="14" fill="${C(lw)}" opacity="${lw === "colorless" ? .5 : .95}"/>`;
  }
  if (p.ring) inner += `<rect x="${x0}" y="25" width="${w}" height="3.5" fill="${C(p.ring)}"/>`;
  if (p.ppt) {
    const fw = p.ppt.tl[p.ppt.tl.length - 1], turbid = p.ppt.style === "turbidity" || p.ppt.style === "colloidal";
    if (p.ppt.dissolve) inner += `<path d="M${L} ${sEnd + 1} Q${cx} ${sEnd - 4} ${Rr} ${sEnd + 1}" fill="none" stroke="${C(fw)}" stroke-width="1.6" stroke-dasharray="2 1.6"/>`;
    else if (turbid) inner += `<rect x="${x0}" y="${liqTop}" width="${w}" height="40" fill="${C(fw)}" opacity="${p.ppt.style === "colloidal" ? .6 : .88}"/>`;
    else inner += `<rect x="${x0 - 1}" y="${sEnd - 3}" width="${w + 2}" height="20" fill="${C(fw)}" stroke="${BOXINK}" stroke-width=".7"/>`;
  }
  if (p.bubbles) inner += `<circle cx="${cx - 2}" cy="22" r="1.6" fill="none" stroke="${BOXINK}" stroke-width=".7"/><circle cx="${cx + 2}" cy="17" r="1.3" fill="none" stroke="${BOXINK}" stroke-width=".7"/>`;
  let out = clip + `<g clip-path="url(#q${k}_${idx})">${inner}</g><path d="${tube}" fill="none" stroke="${BOXINK}" stroke-width="1"/>`;
  if (p.fumes) out += `<ellipse cx="${cx}" cy="7" rx="${w / 2 - 3}" ry="5" fill="${C(p.fumes)}" opacity=".9"/>`;
  if (v.odor && !p.fumes) out += `<path d="M${cx - 3} 4 q-2 -2 0 -3 M${cx + 3} 4 q-2 -2 0 -3" stroke="${BOXINK}" stroke-width=".7" fill="none"/>`;
  return out;
}
function swatch(rows) {

// ───────────────────────── signatures (used by unknown + quiz) ─────────────────────────
const outcomeKey = r => {
  const v = r.visual, p = plan(v);
  return [v.type, (p.ppt && p.ppt.tl.join(">")) || "", p.ppt && p.ppt.style || "", p.ppt && p.ppt.dissolve ? "d" : "", (v.type === "solution" ? (v.timeline || [v.color]).join(">") : ""),
    p.layer ? p.layer.tl.join(">") + "@" + p.layer.position : "", p.fumes || "", p.ring || "", v.type === "flame" || v.type === "stain" ? v.color || "x" : "", v.heat ? "h" : "", v.odor || ""].join("|");
};
const sig = (a, rg) => { const rs = rowsOf(a, rg); return rs.length ? rs.map(outcomeKey).sort().join(" ; ") : null; };
const ALL_ANIONS = ANIONS.map(a => a.anion);
const coverage = new Map(ALL_REAGENTS.map(rg => [rg, ALL_ANIONS.filter(a => rowsOf(a, rg).length).length]));
const TESTS_BY_COVERAGE = ALL_REAGENTS.slice().sort((x, y) => coverage.get(y) - coverage.get(x) || reagentSort(x, y));
function separates(rg, a, b) { const sa = sig(a, rg), sb = sig(b, rg); return sa !== null && sb !== null && sa !== sb; }
function shortestPath(target) {
  const tests = TESTS_BY_COVERAGE.filter(rg => rowsOf(target, rg).length);
  const others = ALL_ANIONS.filter(x => x !== target);
  const sets = tests.map(rg => new Set(others.filter(x => separates(rg, target, x))));
  const ok = idx => others.every(x => idx.some(i => sets[i].has(x)));
  const n = tests.length;
  for (let size = 1; size <= 4; size++) {
    const combo = [];
    const rec = start => {
      if (combo.length === size) return ok(combo) ? combo.slice() : null;
      for (let i = start; i < n; i++) { combo.push(i); const r = rec(i + 1); if (r) return r; combo.pop(); }
      return null;
    };
    const r = rec(0); if (r) return r.map(i => tests[i]);
  }
  // greedy fallback
  const chosen = [], left = new Set(others);
  while (left.size) {
    let best = -1, gain = 0;
    sets.forEach((s, i) => { const gN = [...s].filter(x => left.has(x)).length; if (gN > gain) { gain = gN; best = i; } });
    if (best < 0) break;
    chosen.push(tests[best]); sets[best].forEach(x => left.delete(x));
  }
  return chosen;
}

// ── MCQ (both directions) ──
function candidatesB(row) {

  const seen = new Set([norm(row.observation)]);
  return ROWS.filter(s => s.anion !== row.anion && !own.has(norm(s.observation)) && !ownRows.some(o => alike(o, s)))
    .map(s => ({ s, score: similarity(row, s) })).sort((x, y) => y.score - x.score)

  round = { list: picks, i: 0, q: null, missed: [], reask: false, score: 0, total: 0, done: false, label: opts.label || null };
  nextQuestion();
}
function nextQuestion() {
  if (round.i >= round.list.length) {
    if (!round.reask && round.missed.length) {
      // re-ask every missed item in a different question type (same reaction, new form)
      round.reask = true;
      round.list = round.list.concat(round.missed.map(m => ({ rowId: m.rowId, type: weightedType(m.type), reask: true })));
    } else { round.done = true; qz.rounds++; saveQ(); renderQuiz(); return; }
  }
  const item = round.list[round.i], row = ROW.get(item.rowId);
  let q = build(row, item.type, qz.level);
  for (const t of shuffle(TYPES)) { if (q) break; if (t !== item.type) q = build(row, t, qz.level); }
  if (!q) { round.i++; return nextQuestion(); }
  q.reask = !!item.reask; q.kind = q.type === "mcq" ? (q.dir === "A" ? "mcqA" : "mcqB") : q.type;
  round.q = q; q.answered = false;
  renderQuiz();
}
function finish(right, perRow) {
  const q = round.q, row = ROW.get(q.rowId);
  q.answered = true; q.right = right; round.total++; qz.answered++;
  (perRow || q.rowIds.map(id => [id, right])).forEach(([id, ok]) => record(id, ok));
  if (right) {
    round.score++; qz.correct++; qz.streak = Math.max(0, qz.streak) + 1; qz.misses = 0;
    if (qz.streak >= 3 && qz.level < 3) { qz.level++; qz.streak = 0; }
    if (q.reask) delete qz.missedRows[row.id];
  } else {
    qz.misses++; qz.streak = 0;
    if (qz.misses >= 2 && qz.level > 1) { qz.level--; qz.misses = 0; }
    const bad = perRow ? perRow.filter(p => !p[1]).map(p => p[0]) : [row.id];
    bad.forEach(id => { qz.missedRows[id] = (qz.missedRows[id] || 0) + 1; const r = ROW.get(id); qz.weakRefs[r.slideRef] = (qz.weakRefs[r.slideRef] || 0) + 1; });
    if (!q.reask) round.missed.push({ rowId: row.id, type: q.kind });
  }
  saveQ(); renderQuiz();
  $("#q-fb")?.scrollIntoView({ block: "nearest" });
}
function onQuizClick(e) {
  if (!round || round.done) { if (e.target.closest("#q-new")) { newRound(); window.scrollTo(0, 0); } return; }
  const q = round.q;
  if (e.target.closest("#q-next")) { round.i++; nextQuestion(); window.scrollTo(0, 0); return; }
  if (q.answered) return;
  const o = e.target.closest("[data-opt]");
  if (q.type === "mcq" && o) { q.choice = +o.dataset.opt; finish(q.opts[q.choice].right); return; }
  if (q.type === "fill" && o) { q.choice = +o.dataset.opt; finish(q.opts[q.choice] === q.answer); return; }
  if (q.type === "tf") {
    const t = e.target.closest("[data-tf]");
    if (t && q.stage === "tf") {
      q.tfChoice = t.dataset.tf === "true";
      if (q.truth) finish(q.tfChoice === true);
      else if (q.tfChoice === true) finish(false);
      else { q.stage = "fix"; renderQuiz(); }
      return;
    }
    if (o && q.stage === "fix") { q.choice = +o.dataset.opt; q.stage = "done"; finish(q.fixOpts[q.choice].right); }
    return;
  }
  if (q.type === "match") {
    const l = e.target.closest("[data-ml]"), r = e.target.closest("[data-mr]");
    if (l) { q.sel = q.sel === l.dataset.ml ? null : l.dataset.ml; renderQuiz(); return; }
    if (r && q.sel) { for (const k in q.picks) if (q.picks[k] === r.dataset.mr) delete q.picks[k]; q.picks[q.sel] = r.dataset.mr; q.sel = null; renderQuiz(); return; }
    if (e.target.closest("#q-match-done") && Object.keys(q.picks).length === q.left.length) {
      const per = q.left.map(id => [id, q.picks[id] === id]);
      finish(per.every(p => p[1]), per);
    }
  }
}
INIT.quiz = () => {
  const el = $("#v-quiz");
  el.innerHTML = `<div class="vhead"><h2>كويز</h2><p>سؤال واحد كل مرة، بأنواع الامتحان: اختيار، صح وغلط مع التصحيح، توصيل، وكمّل الجملة. السؤال بالإنجليزي بكلام السلايد، والشرح بالعربي.</p></div>
    <div class="stats" id="q-stats"></div><div class="panel" id="q-panel"></div>`;
  el.addEventListener("click", onQuizClick);
};
ENTER.quiz = (opts = {}) => { if (opts.practice) newRound(opts.practice); else if (!round) newRound(); else renderQuiz(); };
const condOf = r => (r.condition ? ` (${r.condition})` : "");
const TYPE_LABEL = { mcqA: "observation → anion", mcqB: "anion → observation", tf: "True / False", match: "Matching", fill: "Complete" };
function qStem(q) {
  const row = ROW.get(q.rowId);
  if (q.type === "mcq") return q.dir === "A" ? `Which of these anions gives "${row.observation}" with ${row.reagent}${condOf(row)}?`
    : `What is observed when ${row.anion} (${row.anionName}) is treated with ${row.reagent}${condOf(row)}?`;
  if (q.type === "tf") return `True or false? With ${row.reagent}${condOf(row)}, ${row.anion} (${row.anionName}) gives: "${q.shown}"`;
  if (q.type === "match") return `Match each anion with what it gives with ${q.reagent}.`;
  return q.mode === "color" ? `Complete with the slide's exact word: with ${row.reagent}${condOf(row)}, ${row.anion} (${row.anionName}) gives "${q.text}"`
    : `Complete the condition: with ${row.reagent}, ${row.anion} (${row.anionName}) gives "${q.text}" — under which condition?`;
}
const explainRow = row => `<p>مع ${L(row.reagent)}${row.condition ? ` ${L("(" + row.condition + ")")}` : ""}، الـ ${F(row.anion)} ${L("(" + row.anionName + ")")} بيدي ${EN(row.observation)}. <span class="ref" data-ref>${esc(row.slideRef)}</span></p>`;
function feedback(q) {
  const row = ROW.get(q.rowId);
  const next = `<div class="row"><button type="button" class="btn" id="q-next">${round.i + 1 >= round.list.length && (round.reask || !round.missed.length) ? "النتيجة" : "السؤال اللي بعده"}</button></div>`;
  let body = "";
  if (q.type === "mcq") {
    const chosen = q.opts[q.choice];
    const tempt = q.right ? ROW.get(q.temptingRow) : ROW.get(chosen.via || q.temptingRow);
    const whyWrong = q.dir === "A"
      ? `${F(tempt.anion)} مش هو: ${F(tempt.anion)} مع ${L(tempt.reagent)}${tempt.condition ? ` ${L("(" + tempt.condition + ")")}` : ""} بيدي ${EN(tempt.observation)} <span class="ref">${esc(tempt.slideRef)}</span>`
      : `الاختيار ${EN(tempt.observation)} ده بتاع ${F(tempt.anion)} مع ${L(tempt.reagent)}، مش ${F(row.anion)} <span class="ref">${esc(tempt.slideRef)}</span>`;
    body = `<p>الإجابة: ${q.dir === "A" ? anionLabel(row.anion) : EN(row.observation)}</p>${explainRow(row)}<p>${q.right ? "الاختيار اللي كان ممكن يوقعك: " : "ليه اختيارك غلط: "}${whyWrong}</p>`;
  } else if (q.type === "tf") {
    const fake = q.via ? ROW.get(q.via) : null;
    body = `<p>الجملة كانت ${q.truth ? "<b>True</b>" : "<b>False</b>"}.</p>${explainRow(row)}${fake ? `<p>الكلام اللي في الجملة ${EN(fake.observation)} ده بتاع ${F(fake.anion)} مع ${L(fake.reagent)} <span class="ref">${esc(fake.slideRef)}</span></p>` : ""}`;
  } else if (q.type === "match") {
    body = `<ul class="weak">${q.left.map(id => { const r = ROW.get(id), ok = q.picks[id] === id; return `<li>${ok ? "✓" : "✗"} ${F(r.anion)} → ${EN(r.observation)} <span class="ref" data-ref>${esc(r.slideRef)}</span></li>`; }).join("")}</ul>`;
  } else {
    body = `<p>الكلمة الصح: ${EN(q.answer, "b")}. الكلمة بالظبط بتفرق في الامتحان.</p>${explainRow(row)}`;
  }
  return `<div class="fb" id="q-fb" aria-live="polite"><div class="verdict">${q.right ? "✓ صح" : "✗ غلط"}</div>${body}${next}</div>`;
}
function optButtons(opts, render, rightIdx, answered, choice) {
  return opts.map((o, i) => {
    let st = ""; if (answered) st = i === rightIdx ? "right" : i === choice ? "wrong" : "";
    return `<button type="button" class="opt" data-opt="${i}" data-state="${st}" data-right="${i === rightIdx}" ${answered ? "disabled" : ""}><span class="k">${"abcd"[i]}.</span><span>${render(o)}</span></button>`;
  }).join("");
}
function renderQuiz() {
  const levelName = ["", "سهل", "متوسط", "صعب"][qz.level];
  $("#q-stats").innerHTML = `<span>الإجمالي: <b>${qz.correct}/${qz.answered}</b></span><span>المستوى: <b>${levelName}</b></span><span>الجولة: <b>${round.score}/${round.total}</b></span>${round.label ? `<span>${AR(round.label)}</span>` : ""}`;
  const panel = $("#q-panel");

    const weak = Object.entries(qz.weakRefs).sort((x, y) => y[1] - x[1]).slice(0, 8);
    const missedNow = [...new Set(round.missed.map(m => m.rowId))].map(id => ROW.get(id));

      <span class="label">نقط الضعف (من كل الجولات)</span>
      ${weak.length ? `<ul class="weak">${weak.map(([ref, n]) => { const rs = ROWS.filter(r => r.slideRef === ref); const topics = [...new Set(rs.map(r => r.reagent))].slice(0, 3); return `<li><span class="ref">${esc(ref)}</span> غلطت ${n} مرة · راجع ${topics.map(L).join("، ")} في السلايد دي</li>`; }).join("")}</ul>` : `<p class="note">لسه مفيش نقط ضعف متسجلة.</p>`}
      <div class="row" style="margin-top:12px"><button type="button" class="btn" id="q-new">جولة جديدة</button><button type="button" class="btn ghost" data-nav-to="grid">شوف حفظك في الجدول</button></div>`;
    return;
  }
  const q = round.q, row = ROW.get(q.rowId);
  const head = `<p class="note" data-qtype="${q.kind}">${q.reask ? "إعادة لسؤال غلطت فيه، بنوع تاني · " : ""}سؤال ${round.i + 1} من ${round.list.length} · ${TYPE_LABEL[q.kind] || ""}</p>${EN(qStem(q), "p", "q-stem")}`;
  let body = "";

    const rightIdx = q.opts.findIndex(o => o.right);
    body = `<div class="opts" role="group" aria-label="الاختيارات">${optButtons(q.opts, o => q.dir === "A" ? `${sci(o.key)} <small style="font-family:var(--font-body)">(${esc(anionInfo.get(o.key).anionName)})</small>` : sci(o.key), rightIdx, q.answered, q.choice)}</div>`;
  } else if (q.type === "fill") {

  } else if (q.type === "tf") {
    const tfBtn = (val, label) => { let st = ""; if (q.tfChoice !== undefined && q.tfChoice === val) st = (val === q.truth) ? "right" : "wrong"; if (q.answered && val === q.truth) st = "right"; return `<button type="button" class="opt tf" data-tf="${val}" data-state="${st}" ${q.stage !== "tf" ? "disabled" : ""}>${label}</button>`; };
    body = `<div class="opts tf-row" role="group" aria-label="صح ولا غلط">${tfBtn(true, "True")}${tfBtn(false, "False")}</div>
      ${q.stage !== "tf" && !q.truth && q.tfChoice === false ? `<p class="label">صح، الجملة غلط. صحّحها: ${row.anion} مع ${esc(row.reagent)} بيدي إيه؟</p><div class="opts" role="group" aria-label="التصحيح">${optButtons(q.fixOpts, o => sci(o.key), q.fixOpts.findIndex(o => o.right), q.answered, q.choice)}</div>` : ""}`;
  } else if (q.type === "match") {
    const num = id => q.left.indexOf(id) + 1;
    const pickedBy = rid => Object.keys(q.picks).find(k => q.picks[k] === rid);
    body = `<p class="note">دوس على أنيون من فوق، وبعدين على النتيجة بتاعته تحت. الرقم بيوضح التوصيل.</p>
      <div class="match">
        <div class="mcol" role="group" aria-label="الأنيونات">${q.left.map(id => { const r = ROW.get(id); const ok = q.answered ? (q.picks[id] === id ? "right" : "wrong") : ""; return `<button type="button" class="opt mleft" data-ml="${esc(id)}" aria-pressed="${q.sel === id}" data-state="${ok}" ${q.answered ? "disabled" : ""}><span class="k">${num(id)}</span><span>${F(r.anion)} <small style="font-family:var(--font-body)">${esc(r.anionName)}</small></span></button>`; }).join("")}</div>
        <div class="mcol" role="group" aria-label="النتايج">${q.rcol.map(rid => { const r = ROW.get(rid), by = pickedBy(rid); return `<button type="button" class="opt mright" data-mr="${esc(rid)}" ${q.answered ? "disabled" : ""}><span class="k">${by ? num(by) : "·"}</span><span>${r.condition ? `<small>${sci(r.condition)}</small><br>` : ""}${sci(r.observation)}</span></button>`; }).join("")}</div>
      </div>

  }
  panel.innerHTML = head + body + (q.answered ? feedback(q) : "");
